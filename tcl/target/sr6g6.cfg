#
# SR6G6 devices support JTAG transport.
#

set _CHIPNAME sr6g6
set _ENDIAN little

# Configure for SR6-CR52
set _TAPID 0x4BA06477

#set _ENABLE_DME   1
#set _ENABLE_DSPH  1
#set _ENABLE_HSM   1

#
# Definition of target names
#
set _TARGETNAME    armv8

set _TAPNAME $_CHIPNAME.tap
set _DAPNAME $_CHIPNAME.dap

set _APB_AP $_CHIPNAME.apb
set _AXI_AP $_CHIPNAME.axi

set _AP_SEL_APB       0x7C002000
set _AP_SEL_AXI       0x7C004000


# Kite0/Core0: Cortex-R52
set _AHB_AP_K0C0      $_CHIPNAME.k0c0.ahb
set _K0C0             $_CHIPNAME.k0c0.core
set _AP_SEL_AHB_K0C0  0x7E810000


#
# Configure JTAG TAP
#
jtag newtap $_CHIPNAME tap -irlen 4 -ircapture 0x1 -irmask 0xf -expected-id $_TAPID

#
# Configure JTAG DAP
#
dap create $_DAPNAME -chain-position $_TAPNAME -adiv6

# Create the DAP APB-AP MEM-AP target
target create $_APB_AP mem_ap -endian $_ENDIAN \
	-dap $_DAPNAME \
	-ap-num $_AP_SEL_APB

# Create the DAP AXI-AP MEM-AP target
target create $_AXI_AP mem_ap -endian $_ENDIAN \
	-dap $_DAPNAME \
	-ap-num $_AP_SEL_AXI

##########################################################
# Cores
##########################################################

# Create and configure Cross Trigger Interface (CTI) - required for halt and resume
set _CTINAME $_CHIPNAME.k0c0.cti
cti create $_CTINAME \
	-dap $_DAPNAME \
	-ap-num $_AP_SEL_APB \
	-baseaddr 0x7E820000

# Create the target core for K0C0
target create $_K0C0 armv8r -endian $_ENDIAN \
	-dap $_DAPNAME \
	-ap-num $_AP_SEL_APB \
	-dbgbase 0x7E810000 \
	-cti $_CTINAME \
	-coreid 1

# Work-area is a space in RAM used for flash programming
# By default use 4kB
if { [info exists WORKAREASIZE] } {
   set _WORKAREASIZE $WORKAREASIZE
} else {
   set _WORKAREASIZE 0x1000
}


$_K0C0 configure -work-area-phys 0x60000000 -work-area-size $_WORKAREASIZE -work-area-backup 1

# flash size will be probed

# Partition 0-1 CLUSTER0 CORE0 - 3840 KB code flash
set _FLASHNAME_0 $_CHIPNAME.0.flash
flash bank $_FLASHNAME_0 sr6g6 0x28000000 0x3C0000 0 0 $_K0C0

#Partition 2-3 CLUSTER0 CORE1 - 3840 KB code flash
set _FLASHNAME_1 $_CHIPNAME.1.flash
flash bank $_FLASHNAME_1 sr6g6 0x28400000 0x3C0000 0 0 $_K0C0

#Partition 4-5 CLUSTER2 CORE0 - 3840 KB code flash
set _FLASHNAME_2 $_CHIPNAME.2.flash
flash bank $_FLASHNAME_2 sr6g6 0x29000000 0x3C0000 0 0 $_K0C0

#Partition 6-7 CLUSTER2 CORE1 - 4096 KB code flash
set _FLASHNAME_3 $_CHIPNAME.3.flash
flash bank $_FLASHNAME_3 sr6g6 0x29400000 0x400000 0 0 $_K0C0

# Partition 8 CLUSTER 0 CORE 0 Data Flash - 256K
set _FLASHNAME_4 $_CHIPNAME.4.flash
flash bank $_FLASHNAME_4 sr6g6 0x29E00000 0x40000 0 0 $_K0C0

# Partition 9 CLUSTER 0 CORE 0 UTEST FOR BOOT RECORD - 4K
set _FLASHNAME_5 $_CHIPNAME.5.flash
flash bank $_FLASHNAME_5 sr6g6 0x29F87000 0x1000 0 0 $_K0C0

# Partition 11 - HSM 448K code flash
# set _FLASHNAME_5 $_CHIPNAME.7.flash
# flash bank $_FLASHNAME_5 sr6 0x0 0x70000 0 0 $_K0C0

# Partition 12 - HSM 448K code flash
# set _FLASHNAME_6 $_CHIPNAME.8.flash
# flash bank $_FLASHNAME_6 sr6 0x100000 0x70000 0 0 $_K0C0

# Partition 13 - HSM 128K data flash
# set _FLASHNAME_7 $_CHIPNAME.9.flash
# flash bank $_FLASHNAME_7 sr6 0x3A0000 0x20000 0 0 $_K0C0


if { [info exists _ENABLE_DME] } {

# DME: Cortex-M4
set _AHB_AP_DME       $_CHIPNAME.dme.ahb
set _DME              $_CHIPNAME.dme.core
set _AP_SEL_AHB_DME   0x01003000

#
# Create the DAP AHB-AP MEM-AP target for the Cortex-M4 DME
#
target create $_AHB_AP_DME mem_ap -endian $_ENDIAN \
	-dap $_DAPNAME \
	-ap-num $_AP_SEL_AHB_DME

# Create the target core for DME
target create $_DME cortex_m -endian $_ENDIAN \
	-dap $_DAPNAME \
	-ap-num $_AP_SEL_AHB_DME
}


if { [info exists _ENABLE_DSPH] } {

# DSPH: Cortex-M4
set _AHB_AP_DSPH      $_CHIPNAME.dsph.ahb
set _DSPH             $_CHIPNAME.dsph.core
set _AP_SEL_AHB_DSPH  0x01002000

#
# Create the DAP AHB-AP MEM-AP target for the Cortex-M4 DSPH
#
target create $_AHB_AP_DSPH mem_ap -endian $_ENDIAN \
	-dap $_DAPNAME \
	-ap-num $_AP_SEL_AHB_DSPH

# Create the target core for DSPH
target create $_DSPH cortex_m -endian $_ENDIAN \
	-dap $_DAPNAME \
	-ap-num $_AP_SEL_AHB_DSPH
}

if { [info exists _ENABLE_HSM] } {

# HSM: Cortex-M4
set _AHB_AP_HSM       $_CHIPNAME.ham.ahb
set _HSM              $_CHIPNAME.hsm.core
set _AP_SEL_AHB_HSM   0x00007000

#
# Create the DAP AHB-AP MEM-AP target for the Cortex-M4 DME
#
target create $_AHB_AP_HSM mem_ap -endian $_ENDIAN \
	-dap $_DAPNAME \
	-ap-num $_AP_SEL_AHB_HSM

# Create the target core for HSM
target create $_HSM cortex_m -endian $_ENDIAN \
	-dap $_DAPNAME \
	-ap-num $_AP_SEL_AHB_HSM

}

