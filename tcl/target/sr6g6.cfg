#
# Memory procedures
#

proc disable_reset_escalation { } {
	global _AXI_AP
	$_AXI_AP mwd 0x722f060B 0
}

proc clear_memory { start_addr end_addr } {
	global _AXI_AP

	echo "Clearing memory \[$start_addr-$end_addr\]"

	set tmp [expr {$end_addr - $start_addr}]
	set count [expr {$tmp + 1}]
	$_AXI_AP mwd $start_addr 0 [expr {$count / 8}]
}


proc clear_memories { } {
	# work area must be initialized by clear_memory
	echo "initialize work area from 0x60000000 to 0x60000FFF"
	clear_memory 0x60000000 0x60000FFF	
	# non working area can be initilized by fast ram_fill command
	# usage: ram_fill start_addr size_kb [value_32bit]
	echo "initialize RAM from 0x60001000 to 0x6007FFFF"
	ram_fill 0x60001000 0x7F000
	echo "initialize RAM from 0x60400000 to 0x6047FFFF"
	ram_fill 0x60400000 0x80000
	echo "initialize RAM from 0x61000000 to 0x6105FFFF"
	ram_fill 0x61000000 0x60000
	echo "initialize RAM from 0x61400000 to 0x6145FFFF"
	ram_fill 0x61400000 0x60000
	echo "initialize RAM from 0x64000000 to 0x6401FFFF"
	ram_fill 0x64000000 0x20000

#	clear_memory 0x60000000 0x6001BFFF
#	clear_memory 0x60000000 0x6007FFFF
#	clear_memory 0x24020000 0x2403FFFF
}
