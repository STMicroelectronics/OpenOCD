# script for SPC584B family

# Core family configuration
 source [find target/spc56.cfg]

set _CHIPNAME   spc564B
set _ENDIAN     big

if { [info exists TAPID] } {
   set _TAPID  $TAPID
} else {
    set _TAPID  0x0ae49041
}

set _TARGETNAME $_CHIPNAME.tap

#
# Configure JTAG TAP
#
jtag newtap $_CHIPNAME tap \
	-irlen 5 \
	-ircapture 0x1 \
	-irmask 0x1f \
	-expected-id $_TAPID


# Create the target core 
target create $_CHIPNAME.cpu powerpc56 \
	-endian $_ENDIAN \
	-chain-position $_TARGETNAME


#$_CHIPNAME.cpu configure \
#	-event reset-init   { force_reset; disable_watchdog; invalidate_cache }

$_CHIPNAME.cpu configure -event reset-init {
    echo "LOG: reset-init event"
    init_target
}

$_CHIPNAME.cpu configure -event gdb-attach {
    echo "LOG: gdb-attach event"
    reset init
    init_target
}

$_CHIPNAME.cpu configure -event gdb-flash-erase-start {
    echo "LOG: gdb-flash-erase-start event"
#    reset init
#    init_target
}

# Work-area is a space in RAM used for flash programming
# By default use 4kB
if { [info exists WORKAREASIZE] } {
   set _WORKAREASIZE $WORKAREASIZE
} else {
   set _WORKAREASIZE 0x1000
}

# Allow overriding the Flash bank size
if { [info exists FLASH_SIZE] } {
    set _FLASH_SIZE $FLASH_SIZE
} else {
    # autodetect size
    set _FLASH_SIZE 0x200000
}

$_CHIPNAME.cpu configure -work-area-phys 0x40000000 -work-area-size $_WORKAREASIZE

# flash size will be probed
set _FLASHNAME_0 $_CHIPNAME.0.flash
flash bank $_FLASHNAME_0 spc56x 0x0 0x180000 0 0 $_CHIPNAME.cpu

set _FLASHNAME_1 $_CHIPNAME.1.flash
flash bank $_FLASHNAME_1 spc56x 0x180000 0x80000 0 0 $_CHIPNAME.cpu

set _FLASHNAME_2 $_CHIPNAME.2.flash
flash bank $_FLASHNAME_2 spc56x 0x00800000 0x10000 0 0 $_CHIPNAME.cpu

proc init_target { } {
    disable_watchdog
	init_regs
	echo "initialize work area from 0x40000000 to 0x40000FFF"
	# work area must be initialized by clear_memory
	clear_memory 0x40000000 0x40000FFF
	#clear_memory 0x40001000 0x40001FFF
	# clear_memory 0x40000000 0x40007FFF
	echo "setup IVOPR points"
	setspr 0x3F 0x40001000

	#echo "tlb1_set 0x10010000 0xC0000380 0x40000028 0x4000003F"	
	#tlb1_set 0x10000000 0xC0000700 0x00000020 0x0000003F
	#tlb1_set 0x10010000 0xC0000380 0x40000028 0x4000003F
    echo "tlb1_set"
	#tlb1_set 0x10000000 0x00000000 0x00000000 0x00000000
	#tlb1_set 0x10010000 0xC0000500 0xFFF0000A 0xFFF0003F
	#tlb1_set 0x10020000 0xC0000700 0x20000000 0x2000003F
	#tlb1_set 0x10030000 0xC0000400 0x40000008 0x4000003F
	#tlb1_set 0x10040000 0xC0000500 0xC3F00008 0xC3F0003F
	#tlb1_set 0x10050000 0xC0000700 0x00000000 0x0000003F
	
	tlb1_set 0x10000000 0xC0000700 0x00000020 0x0000003F
    tlb1_set 0x10010000 0xC0000400 0x40000020 0x4000003F
	tlb1_set 0x10020000 0xC0000500 0xC3F00008 0xC3F0000F
	tlb1_set 0x10030000 0xC0000500 0xFFE00008 0xFFE0000F
	tlb1_set 0x10040000 0xC0000500 0x8FF00008 0x8FF0000F
	tlb1_set 0x10050000 0xC0000500 0xFFF00008 0xFFF0000F	
	
	echo "initialize RAM from 0x40001000 to 0x40008000"
	# non working area can be initilized by fast ram_fill command
	# usage: ram_fill start_addr size_kb [value_32bit]
	ram_fill 0x40001000 0x7000
}
